<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --primary: #667eea;
            --accent: #764ba2;
            --text: #e2e8f0;
            --text-dim: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-dim);
            margin-top: 8px;
            font-size: 16px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-decoration: none;
            color: var(--text);
            display: block;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .game-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .game-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .game-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 12px;
            background: rgba(102, 126, 234, 0.2);
            color: var(--primary);
        }

        .game-tag.online {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .game-tag.ai {
            background: rgba(237, 137, 54, 0.2);
            color: #ed8936;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            border-color: transparent;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 32px; }
            .game-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>游戏中心</h1>
            <p>选择一个游戏开始游玩</p>
        </div>

        <div class="game-grid">
            <a href="https://wzqweb.lshserver.dpdns.org" class="game-card">
                <div class="game-icon"><i class="ti ti-circle-dot"></i></div>
                <div class="game-name">五子棋</div>
                <div class="game-desc">经典五子棋对弈，支持真人对战和 AI 挑战</div>
                <span class="game-tag online">在线对战</span>
                <span class="game-tag ai">人机对战</span>
            </a>

            <div class="game-card coming-soon">
                <div class="game-icon"><i class="ti ti-chess"></i></div>
                <div class="game-name">国际象棋</div>
                <div class="game-desc">敬请期待</div>
                <span class="game-tag">开发中</span>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon"><i class="ti ti-layout-grid"></i></div>
                <div class="game-name">中国象棋</div>
                <div class="game-desc">敬请期待</div>
                <span class="game-tag">开发中</span>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon"><i class="ti ti-cards"></i></div>
                <div class="game-name">斗地主</div>
                <div class="game-desc">敬请期待</div>
                <span class="game-tag">开发中</span>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon"><i class="ti ti-chart-line"></i></div>
                <div class="game-name">贪吃蛇</div>
                <div class="game-desc">敬请期待</div>
                <span class="game-tag">开发中</span>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon"><i class="ti ti-grid-dots"></i></div>
                <div class="game-name">俄罗斯方块</div>
                <div class="game-desc">敬请期待</div>
                <span class="game-tag">开发中</span>
            </div>
        </div>
    </div>
</body>
</html>
